[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wconnect"
version = "0.1.0"
authors = [
    { name = "William Steve Rodriguez Villamizar", email = "wisrovi.rodriguez@gmail.com" }
]
description = "Messaging library with Telegram and Slack integration for sending and receiving messages"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = [
    "telegram",
    "slack",
    "messaging",
    "bot",
    "chat",
    "notifications",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Communications :: Chat",
    "Intended Audience :: Developers",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "python-telegram-bot>=21.0",
    "aiohttp>=3.9.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
docs = [
    "sphinx>=7.2.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-copybutton>=0.5.0",
    "myst-parser>=2.0.0",
    "sphinx-sitemap>=2.5.0",
    "sphinx-design>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/wisrovi/wconnect"
Documentation = "https://wconnect.readthedocs.io/en/latest/"
Repository = "https://github.com/wisrovi/wconnect"
Issues = "https://github.com/wisrovi/wconnect/issues"
Changelog = "https://github.com/wisrovi/wconnect/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.sdist]
include = [
    "/wconnect",
    "/examples/01 telegram/01 basic",
    "/test",
]
exclude = [
    "**/*.db",
    "**/*.log",
    "**/*.zip",
    "**/__pycache__",
    "**/configs",
    "**/logs",
    "**/*.yaml",
]

[tool.hatch.build.targets.wheel]
packages = ["wconnect"]
exclude = [
    "**/*.db",
    "**/*.log",
    "**/*.zip",
    "**/__pycache__",
]

[tool.pytest.ini_options]
testpaths = ["test"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["wpipe"]
branch = true
omit = [
    "*/tests/*",
    "*/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 72

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
